# Só pra rodar na sua máquina (o Coolify usa só o docker-compose.yml e cuida dos domínios):
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build
services:
  web:
    ports:
      - "${PORTA_SITE:-8080}:80"
  api:
    ports:
      - "${PORTA_API:-8082}:8080"
  keycloak:
    ports:
      - "${PORTA_KEYCLOAK:-8180}:8080"
