<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<meta name="theme-color" content="#0B0F17" />
		<!--cabecalho-->
		<meta property="og:type" content="website" />
		<meta property="og:locale" content="pt_BR" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<script>document.documentElement.classList.add('js');</script>
		<script>
			// tema guardado: aplicado antes de desenhar, pra não piscar o escuro em quem escolheu o claro (ver src/lib/tema.ts)
			try { if (localStorage.getItem('tema') === 'claro') { document.documentElement.dataset.tema = 'claro'; document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#F4F1EA'); } } catch (e) {}
		</script>
	</head>
	<body>
		<div id="raiz"><!--app--></div>
		<!--dados-->
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
