# Só o site estático. A API (api.…) e o Keycloak (auth.…) têm domínios próprios.
server {
	listen 80;
	server_name _;

	root /site/atual;
	index index.html;
	charset utf-8;
	# redireciona com caminho relativo (mantém domínio e porta de quem pediu)
	absolute_redirect off;

	# arquivos com hash no nome nunca mudam
	location /_astro/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	location / {
		try_files $uri $uri/ =404;
		add_header Cache-Control "no-cache";
	}

	# o painel não deve aparecer em busca nem ficar em cache
	location = /admin {
		return 301 /admin/;
	}

	location /admin/ {
		try_files $uri $uri/ /admin/index.html =404;
		add_header Cache-Control "no-store";
		add_header X-Robots-Tag "noindex";
	}
}
